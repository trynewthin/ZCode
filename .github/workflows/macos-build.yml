name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-build.yml"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS arm64 package
        env:
          ZCODE_ENABLE_MAC_SIGN: "0"
        run: pnpm bundle:desktop -- --os mac --arch arm64

      - name: Show build outputs
        run: |
          echo "Desktop dist:"
          find packages/desktop/dist -maxdepth 2 -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="macos-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          TITLE="ZCode v${VERSION} · macOS arm64"

          gh release create "$TAG" \
            packages/desktop/dist/*.dmg \
            packages/desktop/dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "macOS arm64 build from commit \`$GITHUB_SHA\`." \
            --latest
